name: Source validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize host source
        run: python tools/materialize_host_source.py

      - name: Release-readiness smoke tests
        run: python tools/release_smoke_test.py

      - name: Inspect host bridge points
        run: python tools/inspect_host_bridge.py

      - name: Canonical frontend validation
        run: python tools/validate_generated_index.py --index src/MichelsLife/frontend/index.html

      - name: Microsoft Store packaging smoke tests
        run: python tools/store_smoke_test.py
