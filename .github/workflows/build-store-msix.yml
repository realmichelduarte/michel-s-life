name: Build Microsoft Store MSIX

on:
  workflow_dispatch:
    inputs:
      package_identity_name:
        description: Exact Package/Identity/Name from Partner Center.
        required: true
        type: string
      publisher:
        description: Exact Publisher value from Partner Center (for example CN=...).
        required: true
        type: string
      publisher_display_name:
        description: Exact Publisher display name from Partner Center.
        required: true
        type: string
      display_name:
        description: Store display name.
        required: true
        default: "Michel's Life"
        type: string

permissions:
  contents: read

env:
  RELEASES_REPO: realmichelduarte/michel-s-life-releases

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Materialize host source
        shell: pwsh
        run: python tools/materialize_host_source.py

      - name: Validate release and Store packaging source
        shell: pwsh
        run: |
          python tools/release_smoke_test.py
          python tools/store_smoke_test.py

      - name: Resolve app version
        id: ver
        shell: pwsh
        run: |
          [xml]$proj = Get-Content 'src/MichelsLife/MichelsLife.csproj'
          $v = [string]$proj.Project.PropertyGroup.Version
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Packaging Michel's Life Store build v$v"

      - name: Download current visual bundle
        shell: pwsh
        run: |
          $base = "https://github.com/$env:RELEASES_REPO/releases/latest/download/AppBundle.zip"
          Invoke-WebRequest -Uri $base -OutFile 'src/MichelsLife/AppBundle.zip'

      - name: Generate current Michel's Life icon
        shell: pwsh
        run: |
          choco install imagemagick --yes --no-progress
          New-Item -ItemType Directory -Force 'src/MichelsLife/Assets' | Out-Null
          $magick = Get-Command magick -ErrorAction SilentlyContinue
          if (-not $magick) {
            $exe = Get-ChildItem "$env:ProgramFiles\ImageMagick*" -Filter magick.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $exe) { throw 'ImageMagick magick.exe not found.' }
            $magickPath = $exe.FullName
          } else { $magickPath = $magick.Source }
          & $magickPath -background none 'branding/michels_life_logo.svg' -define icon:auto-resize=256,128,64,48,32,16 'src/MichelsLife/Assets/michels_life_icon.ico'
          if ($LASTEXITCODE -ne 0) { throw 'App icon generation failed.' }

      - name: Prepare Store frontend bundle from canonical source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python tools/validate_generated_index.py --index src/MichelsLife/frontend/index.html
          python tools/append_overlay.py --index src/MichelsLife/frontend/index.html --overlay src/MichelsLife/AppPatches/i18n-v308.html --marker "mlv-i18n-v308"
          python tools/replace_bundle_index.py --bundle src/MichelsLife/AppBundle.zip --index src/MichelsLife/frontend/index.html
          python tools/inject_bundle_asset.py --bundle src/MichelsLife/AppBundle.zip --source branding/michel_duarte_avatar.jpg --arcname assets/michel_duarte_avatar.jpg
          python tools/inject_bundle_asset.py --bundle src/MichelsLife/AppBundle.zip --source branding/michels_life_logo.svg --arcname assets/michels_life_logo.svg
          python tools/append_store_overlay.py --index src/MichelsLife/frontend/index.html --overlay src/MichelsLife/AppPatches/store-msix.html
          python tools/replace_bundle_index.py --bundle src/MichelsLife/AppBundle.zip --index src/MichelsLife/frontend/index.html

      - name: Inject Google OAuth build credential
        shell: pwsh
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_CLIENT_SECRET)) {
            throw 'GOOGLE_CLIENT_SECRET repository secret is required for the Store build.'
          }
          $path = 'src/MichelsLife/BuildSecrets.cs'
          $content = Get-Content $path -Raw
          $oauthSecret = $env:GOOGLE_CLIENT_SECRET.Trim()
          if ($oauthSecret.StartsWith('{')) {
            try {
              $oauthConfig = $oauthSecret | ConvertFrom-Json
              $oauthSecret = [string]$oauthConfig.installed.client_secret
            } catch {
              throw 'GOOGLE_CLIENT_SECRET must be either the raw Desktop client_secret or the downloaded Desktop OAuth JSON.'
            }
          }
          if ([string]::IsNullOrWhiteSpace($oauthSecret)) {
            throw 'The Desktop OAuth client_secret resolved to an empty value.'
          }
          $sha = [System.Security.Cryptography.SHA256]::Create()
          try {
            $hashBytes = $sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($oauthSecret))
            $secretHash = -join ($hashBytes | ForEach-Object { $_.ToString('x2') })
          } finally {
            $sha.Dispose()
          }
          if ($secretHash -ne 'b3bd5879455e68562da33945ce1377369a961aead618a0c97df1dfa16e11c4c3') {
            throw 'GOOGLE_CLIENT_SECRET does not match the approved Michel''s Life v3.0.207 Desktop OAuth client.'
          }
          $escaped = $oauthSecret.Replace('\','\\').Replace('"','\"')
          $content = $content.Replace('__BUILD_SECRET_GOOGLE__', $escaped)
          Set-Content -Path $path -Value $content -NoNewline -Encoding UTF8

      - name: Publish unpacked x64 app for MSIX
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/store-publish | Out-Null
          dotnet restore src/MichelsLife/MichelsLife.csproj
          dotnet publish src/MichelsLife/MichelsLife.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false `
            -o artifacts/store-publish

      - name: Build MSIX layout
        shell: pwsh
        env:
          PACKAGE_IDENTITY_NAME: ${{ inputs.package_identity_name }}
          STORE_PUBLISHER: ${{ inputs.publisher }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name }}
          STORE_DISPLAY_NAME: ${{ inputs.display_name }}
        run: |
          $layout = 'artifacts/msix-layout'
          New-Item -ItemType Directory -Force $layout | Out-Null
          Copy-Item 'artifacts/store-publish/*' $layout -Recurse -Force
          New-Item -ItemType Directory -Force "$layout/Assets" | Out-Null
          pwsh -File tools/create_store_assets.ps1 `
            -IconPath 'src/MichelsLife/Assets/michels_life_icon.ico' `
            -OutputDir "$layout/Assets"
          python tools/render_store_manifest.py `
            --template store/AppxManifest.template.xml `
            --output "$layout/AppxManifest.xml" `
            --package-name "$env:PACKAGE_IDENTITY_NAME" `
            --publisher "$env:STORE_PUBLISHER" `
            --publisher-display-name "$env:STORE_PUBLISHER_DISPLAY_NAME" `
            --display-name "$env:STORE_DISPLAY_NAME" `
            --version '${{ steps.ver.outputs.version }}'

      - name: Create unsigned Store MSIX
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter makeappx.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $makeappx) { throw 'makeappx.exe not found on the Windows runner.' }

          $v='${{ steps.ver.outputs.version }}'
          $msix="artifacts/MichelsLife-Store-v$v-x64.msix"
          & $makeappx.FullName pack /d artifacts/msix-layout /p $msix /o
          if ($LASTEXITCODE -ne 0) { throw 'MakeAppx pack failed.' }

          Remove-Item artifacts/msix-verify -Recurse -Force -ErrorAction SilentlyContinue
          & $makeappx.FullName unpack /p $msix /d artifacts/msix-verify /o
          if ($LASTEXITCODE -ne 0) { throw 'MakeAppx verification unpack failed.' }
          if (-not (Test-Path 'artifacts/msix-verify/AppxManifest.xml')) { throw 'MSIX verification manifest missing.' }
          if (-not (Test-Path 'artifacts/msix-verify/MichelsLife.exe')) { throw 'MSIX verification executable missing.' }

          $hash=(Get-FileHash $msix -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MichelsLife-Store-v$v-x64.msix" | Set-Content "$msix.sha256" -Encoding ascii
          Copy-Item artifacts/msix-layout/AppxManifest.xml artifacts/AppxManifest.Store.xml

      - uses: actions/upload-artifact@v4
        with:
          name: MichelsLife-Store-v${{ steps.ver.outputs.version }}
          path: |
            artifacts/MichelsLife-Store-v${{ steps.ver.outputs.version }}-x64.msix
            artifacts/MichelsLife-Store-v${{ steps.ver.outputs.version }}-x64.msix.sha256
            artifacts/AppxManifest.Store.xml
          if-no-files-found: error

      - name: Store package note
        shell: pwsh
        run: |
          Write-Host 'The MSIX artifact is intentionally unsigned.'
          Write-Host 'Upload it to Partner Center. Microsoft Store re-signs accepted MSIX packages.'
          Write-Host 'Do not publish this unsigned MSIX as a direct-download installer.'
